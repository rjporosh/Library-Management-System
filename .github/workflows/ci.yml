name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore LibraryManagementSystem.slnx

      - name: Build (warnings are errors)
        run: dotnet build LibraryManagementSystem.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LibraryManagementSystem.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Verify EF migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          dotnet ef migrations has-pending-model-changes \
            --project src/Library.Infrastructure --startup-project src/Library.Api \
          && echo "No pending model changes."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/library-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/library-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/Library.Api/Dockerfile -t library-api:ci .
      - name: Build web image
        run: docker build -t library-web:ci ./frontend/library-web
      - name: Smoke test the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            curl -sf http://localhost:5254/health && break
            sleep 3
          done
          curl -sf http://localhost:5254/api/dashboard
          docker compose down -v
