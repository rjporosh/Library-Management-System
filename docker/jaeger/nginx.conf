# HTTP basic-auth gate in front of the Jaeger UI (Jaeger itself has no auth).
# Credentials live in docker/jaeger/.htpasswd - regenerate for real deployments:
#   printf 'jaeger:%s\n' "$(openssl passwd -apr1 '<new-password>')" > docker/jaeger/.htpasswd
server {
    listen 80;

    location / {
        auth_basic           "Jaeger - Library Management System";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass         http://jaeger:16686;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
